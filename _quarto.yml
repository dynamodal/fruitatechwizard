project:
  type: website

  render:
    - "*.qmd"

  resources:
    - "files/**"

freeze: auto

website:
  title: "Fruita Tech Wizard"
  description: "Friendly, local tech help in Fruita, Colorado. Computers, phones, WiFi, scams, AI, smart homes, and small business IT. House calls, phone, or screen share."
  favicon: "files/favicon-dino.png"
  site-url: "https://fruitatechwizard.com"
  search: false
  open-graph:
    image: files/social-card.png
    image-width: 1200
    image-height: 630
  twitter-card:
    image: files/social-card.png
    card-style: summary_large_image
  navbar:
    pinned: false
    logo: "files/favicon-dino.png"
    logo-alt: "Wizard dinosaur"
    right:
      - href: services.qmd
        text: "Services"
      - href: scams.qmd
        text: "Scam help"
      - href: about.qmd
        text: "About"
      - href: contact.qmd
        text: "Contact"

  page-footer:
    left: |
      <span class="faux-block">© 2026 Fruita Tech Wizard · Fruita, Colorado</span>
      <span class="faux-block">FTW? It's a nod to our [WTF stickers](about.qmd#why-ftw).</span>
    right: |
      <span class="faux-block"><i class="bi bi-telephone" aria-hidden="true"></i> [(720) 213-6374](tel:+17202136374)</span>
      <span class="faux-block"><i class="bi bi-envelope" aria-hidden="true"></i> [help@fruitatechwizard.com](mailto:help@fruitatechwizard.com)</span>

format:
  html:
    theme:
      - default
      - html/styles.scss
    toc: false
    anchor-sections: false
